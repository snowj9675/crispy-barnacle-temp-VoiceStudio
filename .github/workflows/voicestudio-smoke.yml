name: VoiceStudio Docker smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Generate temporary API key and validate Compose
        shell: bash
        run: |
          echo "OMNIVOICE_API_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          docker compose -f compose.yaml config --quiet

      - name: Pull official stable image
        run: docker compose -f compose.yaml pull

      - name: Launch VoiceStudio
        run: docker compose -f compose.yaml up -d

      - name: Check HTTP service
        shell: bash
        run: |
          for i in $(seq 1 90); do
            if curl --silent --show-error --fail --max-time 5 http://127.0.0.1:3900/ -o /dev/null; then
              echo "VoiceStudio HTTP server responded successfully."
              exit 0
            fi
            sleep 10
          done
          echo "VoiceStudio did not become ready."
          exit 1

      - name: Show container status and logs
        if: always()
        run: |
          docker compose -f compose.yaml ps
          docker compose -f compose.yaml logs --tail 100

      - name: Stop services
        if: always()
        run: docker compose -f compose.yaml down
