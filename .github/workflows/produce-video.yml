name: Produce Human Thesis video to R2

on:
  workflow_dispatch:
    inputs:
      episode_path:
        description: "Input episode Markdown file"
        required: true
        default: "input/demo-video.md"
        type: string
      preview:
        description: "Render short preview (~500 narration characters), not full episode"
        required: true
        default: true
        type: boolean
  push:
    branches: [main]
    paths:
      - "input/*.md"
      - "input/**/*.md"

permissions:
  contents: read

concurrency:
  group: human-thesis-producer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-24.04
    outputs:
      episodes: ${{ steps.paths.outputs.episodes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: paths
        env:
          EVENT: ${{ github.event_name }}
          INPUT_PATH: ${{ inputs.episode_path }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess
          if os.environ["EVENT"] == "workflow_dispatch":
              files=[os.environ.get("INPUT_PATH") or "input/demo-video.md"]
          else:
              before=os.environ.get("BEFORE","")
              if before and before.strip("0"):
                  files=subprocess.check_output(["git","diff","--name-only","--diff-filter=ACMR",before,os.environ["SHA"],"--","input/"],text=True).splitlines()
              else:
                  files=subprocess.check_output(["git","ls-files","input/"],text=True).splitlines()
          files=[f for f in files if f.startswith("input/") and f.endswith(".md") and pathlib.Path(f).is_file()]
          if not files:
              raise SystemExit("No changed input/*.md episode files found")
          with open(os.environ["GITHUB_OUTPUT"],"a") as out:
              out.write("episodes="+json.dumps(sorted(set(files)))+"\n")
          print("Episodes:",files)
          PY

  produce:
    needs: discover
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    environment: ${{ vars.R2_ENVIRONMENT || 'production' }}
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        episode: ${{ fromJSON(needs.discover.outputs.episodes) }}
    env:
      EPISODE: ${{ matrix.episode }}
      PREVIEW_OVERRIDE: ${{ github.event_name == 'workflow_dispatch' && (inputs.preview && 'true' || 'false') || '' }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT || vars.R2_ENDPOINT || secrets.ENDPOINT || vars.ENDPOINT || 'https://9855374e7d416e277c4f2f34d83163dd.r2.cloudflarestorage.com' }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID || secrets.ACCESS_KEY_ID || secrets.AWS_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || secrets.SECRET_ACCESS_KEY || secrets.AWS_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET || secrets.BUCKET || vars.BUCKET || 'human-thesis' }}
      R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL || vars.R2_PUBLIC_BASE_URL }}
      HF_HUB_DISABLE_TELEMETRY: "1"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore speech models between runs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface/hub
            ~/.cache/torch/hub
          key: ht-kokoro-george-whisper-small-v1

      - name: Install FFmpeg and speech/video dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install "kokoro==0.9.4" "numpy<3" "soundfile>=0.12" "faster-whisper>=1.1,<2" "av==18.1.0" "requests>=2.31,<3" "PyYAML>=6,<7" "boto3>=1.34,<2"

      - name: Prepare episode and metadata
        shell: bash
        run: |
          set -euo pipefail
          TARGET="build/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/$(basename "$EPISODE" .md)"
          echo "TARGET=$TARGET" >> "$GITHUB_ENV"
          python scripts/build_video.py parse --episode "$EPISODE" --target "$TARGET" --preview-override "$PREVIEW_OVERRIDE"

      - name: Generate Kokoro George audio (same voice and pauses)
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess, os
          target=os.environ["TARGET"]
          episode=json.load(open(f"{target}/episode.json"))
          args=["python","scripts/generate_kokoro_george.py",
                "--script",f"{target}/narration_source.txt",
                "--target",target,"--speed",str(episode["voice"]["speed"])]
          if episode["preview"]:
              args.append("--preview")
          subprocess.run(args,check=True)
          PY

      - name: Generate word-timed cinematic captions
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate_subtitles.py --audio "$TARGET/narration.mp3" --target "$TARGET"

      - name: Choose visual scenes from catalog
        shell: bash
        run: |
          set -euo pipefail
          test -f catalog.json
          python scripts/build_video.py plan --target "$TARGET" --catalog catalog.json

      - name: Render footage, karaoke captions, and voice to MP4
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_video.py render --target "$TARGET"

      - name: Upload completed video and metadata to R2
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_video.py publish --target "$TARGET"

      - name: Failure explanation
        if: failure()
        run: |
          echo "Video production failed; review the preceding job step's logs."
          echo "Do not paste R2 secret values into issue comments or logs."
