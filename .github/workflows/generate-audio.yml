name: Generate Kokoro George narration

on:
  workflow_dispatch:
    inputs:
      script_path:
        description: "Text file within scripts/ (e.g. scripts/demo.txt)"
        required: true
        default: "scripts/demo.txt"
        type: string
      preview:
        description: "Short voice preview (~500 characters)"
        required: true
        default: true
        type: boolean
      speed:
        description: "George's narration speed (Colab default: 0.90)"
        required: true
        default: "0.90"
        type: string

permissions:
  contents: write

concurrency:
  group: kokoro-george-${{ github.ref }}
  cancel-in-progress: false

jobs:
  narrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Kokoro and audio dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng ffmpeg
          python -m pip install --upgrade pip
          python -m pip install "kokoro==0.9.4" "soundfile>=0.12" "numpy<3"

      - name: Generate George narration
        shell: bash
        env:
          SCRIPT_PATH: ${{ inputs.script_path }}
          PREVIEW: ${{ inputs.preview }}
          SPEED: ${{ inputs.speed }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os
          root = (Path.cwd() / "scripts").resolve()
          path = (Path.cwd() / os.environ["SCRIPT_PATH"]).resolve()
          if not path.is_relative_to(root) or path.suffix != ".txt" or not path.is_file():
              raise SystemExit("Input must be an existing .txt file inside scripts/")
          PY
          TARGET="generated/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          options=()
          if [ "$PREVIEW" = "true" ]; then options+=(--preview); fi
          python scripts/generate_kokoro_george.py \
            --script "$SCRIPT_PATH" \
            --target "$TARGET" \
            --speed "$SPEED" \
            "${options[@]}"
          echo "TARGET_DIR=$TARGET" >> "$GITHUB_ENV"

      - name: Commit MP3 straight to GitHub
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$TARGET_DIR/narration.mp3" "$TARGET_DIR/script.txt" "$TARGET_DIR/manifest.json"
          git commit -m "Kokoro George narration for run ${GITHUB_RUN_ID}"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "Published at $TARGET_DIR/narration.mp3"
