name: Validate video builder

on:
  push:
    branches: [main]
    paths:
      - "scripts/build_video.py"
      - "tests/test_video_builder.py"
      - ".github/workflows/validate-video-builder.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lightweight test dependencies
        run: python -m pip install "PyYAML>=6,<7" "requests>=2.31,<3"
      - name: Check syntax
        run: python -m py_compile scripts/build_video.py tests/test_video_builder.py
      - name: Run recovery regression tests
        run: python -m unittest discover -s tests -v
